name: release
on:
  workflow_dispatch:
    inputs:
      bump:
        description: patch, minor or major, applied to the last release tag
        type: choice
        options: [patch, minor, major]
        default: minor
      dry_run:
        description: Plan and print; write nothing
        type: boolean
        default: true
      skip_ci_check:
        description: Release without waiting for the CI workflow
        type: boolean
        default: false
      skip_tests:
        description: Do not run the test commands before publishing
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  release:
    uses: habemus-papadum/pdum_ship/.github/workflows/release.yml@main
    with:
      # One package: the PyPI distribution. The widgets workspace is private and
      # ships inside the wheel as a built bundle.
      package: habemus-papadum-coiled
      bump: ${{ inputs.bump }}
      dry_run: ${{ inputs.dry_run }}
      skip_ci_check: ${{ inputs.skip_ci_check }}
      skip_tests: ${{ inputs.skip_tests }}
    secrets:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    permissions:
      contents: write
      actions: read
      id-token: write   # requested by the reusable job; unused without an npm publish
